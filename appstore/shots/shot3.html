<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage blue">
  <div class="headline">
    <h1>Freeze the frame.<br>Then draw right on it.</h1>
    <p>Pen and highlighter in any color &mdash; then wipe it clean and go live again</p>
  </div>
  <div class="window bleed">
    <div class="titlebar"><div class="dots"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></div>
      <div class="title"><b>BlueBird DocuCam</b></div></div>
    <div class="viewer">
      <div class="paper page-portrait">
        <div class="ws-h">Fractions</div>
        <div class="ws-rule"></div>
        <div class="ws-meta"><span>Name: _____________</span><span>Date: ______</span></div>
        <ul class="ws-list">
          <li><span class="frac"><span>1</span><span>2</span></span><span class="op">+</span><span class="frac"><span>1</span><span>4</span></span><span class="op">=</span><span class="blank"></span></li>
          <li><span class="frac"><span>2</span><span>3</span></span><span class="op">&minus;</span><span class="frac"><span>1</span><span>6</span></span><span class="op">=</span><span class="blank"></span></li>
          <li><span class="frac"><span>3</span><span>4</span></span><span class="op">&times;</span><span style="font-size:18px">2</span><span class="op">=</span><span class="blank"></span></li>
          <li><span class="frac"><span>5</span><span>8</span></span><span class="op">&minus;</span><span class="frac"><span>1</span><span>4</span></span><span class="op">=</span><span class="blank"></span></li>
        </ul>
        <div class="ws-figs">
          <div class="pie" style="background:conic-gradient(var(--brand) 0 50%,#eef3ff 0 100%)"></div>
          <div class="pie" style="background:conic-gradient(var(--brand) 0 75%,#eef3ff 0 100%)"></div>
        </div>
        <!-- annotation ink -->
        <div class="hl" style="left:26px;top:150px;width:158px;height:24px"></div>
        <div class="circle-red" style="left:248px;top:196px;width:70px;height:34px"></div>
        <div class="pen-u" style="left:250px;top:120px;width:66px"></div>
        <div class="checkmark" style="left:300px;top:92px">&check;</div>
      </div>
      <div class="badge tr"><span class="ic">&#9208;</span> Paused</div>
      <div class="anno">
        <span class="tool">&#9998; Pen</span>
        <span class="sep"></span>
        <div class="swatch" style="background:#ff3b30"></div>
        <div class="swatch" style="background:#ffd400"></div>
        <div class="swatch" style="background:#12b76a"></div>
        <div class="swatch" style="background:#296BEB;border-color:#fff"></div>
        <span class="sep"></span>
        <span class="tool" style="opacity:.7">Clear</span>
      </div>
    </div>
  </div>
</div>
</body></html>
