<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body>
<div class="stage light">
  <div class="headline">
    <h1>Zoom right in on<br>the fine print</h1>
    <p>&hellip;and rotate, flip, freeze, or snapshot &mdash; all a keystroke away</p>
  </div>
  <div class="chips">
    <div class="chip"><span class="ic">&#128269;</span> Zoom &amp; pan</div>
    <div class="chip"><span class="ic">&#8635;</span> Rotate</div>
    <div class="chip"><span class="ic">&#8646;</span> Flip</div>
    <div class="chip"><span class="ic">&#128247;</span> Snapshot</div>
    <div class="chip"><span class="ic">&#9210;</span> Full screen</div>
  </div>
  <div class="window bleed">
    <div class="titlebar"><div class="dots"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i></div>
      <div class="title"><b>BlueBird DocuCam</b></div></div>
    <div class="viewer zoom">
      <div class="paper page-portrait">
        <div class="ws-h">Fractions</div>
        <div class="ws-rule"></div>
        <div class="ws-meta"><span>Name: _____________</span><span>Date: ______</span></div>
        <ul class="ws-list">
          <li><span class="frac"><span>1</span><span>2</span></span><span class="op">+</span><span class="frac"><span>1</span><span>4</span></span><span class="op">=</span><span class="blank"></span></li>
          <li><span class="frac"><span>2</span><span>3</span></span><span class="op">&minus;</span><span class="frac"><span>1</span><span>6</span></span><span class="op">=</span><span class="blank"></span></li>
          <li><span class="frac"><span>3</span><span>4</span></span><span class="op">&times;</span><span style="font-size:18px">2</span><span class="op">=</span><span class="blank"></span></li>
          <li><span class="frac"><span>5</span><span>8</span></span><span class="op">&minus;</span><span class="frac"><span>1</span><span>4</span></span><span class="op">=</span><span class="blank"></span></li>
        </ul>
      </div>
    </div>
  </div>
</div>
</body></html>
